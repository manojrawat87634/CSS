<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <input type="text" id="inp">
        <button onclick="showInp()">Submit</button>
        <p id="para"></p>

        <script>
            function showInp (){
                const inp_value = document.getElementById('inp').value;
                document.getElementById('para').innerText = inp_value;
            }
        </script>
</body>
</html>
