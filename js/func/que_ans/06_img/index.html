<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            height: 180px;
        }
    </style>
</head>

<body>
    <img src="1.jfif" alt="" id="img">
    <button onclick="changeImg()">Change</button>
    <script>
        const changeImg = () => {
            const img = document.getElementById('img');
            console.log(img.src);
            console.log(img.src == 'http://127.0.0.1:5500/06_img/1.jfif');
            if (img.src == 'http://127.0.0.1:5500/06_img/1.jfif') {
                img.src = "2.webp";
            }
            else if (img.src == 'http://127.0.0.1:5500/06_img/2.webp') {
                img.src = "3.jpg";
            }
            else {
                img.src = '1.jfif'
            }
        }
    </script>
</body>

</html>
