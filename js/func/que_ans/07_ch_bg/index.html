<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Heading One</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Tempora, ratione incidunt explicabo ut alias minima
        repellendus repudiandae! Dicta fugiat tempora, itaque, odio provident eum libero rem officia quibusdam quam
        nisi!</p>
        <button onclick="toggleMode()">Toggle</button>
    <script>
        const toggleMode = () => {

            if (document.body.style.backgroundColor == "black") {
                document.body.style.backgroundColor = 'white';
                document.body.style.color = 'black';
            }
            else {
                document.body.style.backgroundColor = 'black';
                document.body.style.color = 'white';
            }
        }
    </script>
</body>

</html>
