<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="inp" oninput="onCh()">
    <span id="c"></span>

                // "abcde".length
                // "".length
                document.getElementById('c').innerHTML = user_inp.length;
            }
    </script>
</body>
