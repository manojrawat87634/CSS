<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="inp">
    <button onclick="addItem()">Click</button>
    <ol id="root">

    </ol>
    <script>

        // function addItem (){

        // const addItem = ()=>{

        const addItem = ()=>{
            const item = document.getElementById('inp').value;
            document.getElementById('root').innerHTML += `<li> ${item} </li>`;
        }
    </script>
</body>
</html>
