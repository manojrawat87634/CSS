<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

        <table id="root" border="1">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Message</th>
            </tr>
        </table>
    <script>
        const getData = async ()=>{
            const res = await fetch('https://munnapassword.pythonanywhere.com/contact/');
            const data = await res.json();
            console.log(data);
            const root = document.getElementById('root')
            data.forEach((e)=>{
                root.innerHTML += `
                <tr> 
                    <td> ${e.name}</td>
                    <td> ${e.email}</td>
                    <td> ${e.phone}</td>
                    <td> ${e.message}</td>
                </tr>
                `;
            })
        }

        getData();
    </script>
</body>
</html>
