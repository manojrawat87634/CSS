<head>

<body>
    <script>
        document.write(12 + 12);//24
        document.write("<br>");

        document.write("<br>");

        document.write("<br>");//
        document.write(3 ** 3);// 27
        document.write("<br>");//
        document.write(13 % 5);// 3
        document.write("<br>");//
    </script>
