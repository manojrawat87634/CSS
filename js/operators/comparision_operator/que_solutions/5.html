<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let temp = parseInt(prompt("Enter a temperature in Celsius:"));
        if (temp > 100.4){
            document.write("Fever");
        }
        else{
            document.write("Normal");
        }
</script>
</body>
</html>
