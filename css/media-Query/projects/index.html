<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

          *{
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .container{
            background-color: rgb(0, 0, 0, 0.7);
            display: flex;
            padding: 20px;
            gap: 20px;
            justify-content: space-around;
            font-size: 18px;
            font-weight: 600;
            align-items: center;
            color: white;
        }

        .container img{
            height: 30px;
        }

        .mla{
            margin-left: auto;
        }

        .post-btn{
            background-color: #e60278;
            padding: 10px 20px ;
            border: none;
            color: white;
        }
        /* Laptop */
        @media (min-width : 1024px) {

            .mob,
            .tab {
                display: none;
            }
        }

        /* Tablet */
        @media (min-width : 768px) and (max-width : 1023px) {

            .mob,
            .lap {
                display: none;
            }
        }

        /* Phone */
        @media(max-width : 767px) {

            .lap,
            .tab {
                display: none;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<link rel="stylesheet" href="abc.css">
</head>

<body>
    <div class="lap">
        <div class="container">
            <img src="https://www.f-cdn.com/assets/main/en/assets/freelancer-logo-light.svg" alt="">
            <div>Hire Freelance<i class="fa-solid fa-angle-down"></i></div>
            <div>Find work <i class="fa-solid fa-angle-down"></i></div>
            <div>Solutions <i class="fa-solid fa-globe"></i></div>
            <div class="mla">Login</div>
            <div>Sign Up</div>
            <div><button class="post-btn">Post a Project</button></div>
        </div>
    </div>
    <div class="mob">
        <div class="container">
        <img src="https://www.f-cdn.com/assets/main/en/assets/freelancer-logo-light.svg" alt="">
        <div class="mla">Login</div>
        <div><i class="fa-bars fa-solid"></i></div>
    </div>
    </div>

    <div class="tab">
      <div class="container">
        <img src="https://www.f-cdn.com/assets/main/en/assets/freelancer-logo-light.svg" alt="">
        <div class="mla">Login</div>
        <div>Sign Up</div>
        <div><i class="fa-bars fa-solid"></i></div>
    </div>
    </div>
</body>

</html>
