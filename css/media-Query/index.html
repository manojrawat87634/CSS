<html>
    <head>
        <style>
            /* Laptop */
            @media(min-width : 1024px){
                .phone, .tab{
                    display: none;
                }
            }

            /* Tablet */
            @media (min-width : 769px) and (max-width : 1023px){
                .laptop, .phone{display: none;}
            }

            /* Mobile Phone */
            @media(max-width : 768px){
                .tab, .laptop{
                    display: none;
                }
            }


            
        *{
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .container{
            padding: 20px;
            box-shadow: 0 0 10px black;
            display: flex;
            font-weight: 700;
            font-size: 17px;
            color: rgb(73, 73, 73);
            gap: 20px;
            align-items: center;
        }

        .container img{
            height: 30px;
            margin-right: auto;
        }

        .join-btn{
            border: 1px solid black;
            background-color: white;
            border-radius: 4px;
            font-weight: 700;
            font-size: 17px;
            padding: 10px 20px;
        }
        </style>
    </head>

    <body>
        <div class="laptop">
            <h1>Laptop</h1>
        </div>

        <div class="phone">
            <h1>Phone</h1>
        </div>

        <div class="tab">
            <h1>Tablet</h1>
        </div>
    </body>
</html>
