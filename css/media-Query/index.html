<html>
    <head>
        <style>
            /* Laptop */
            @media(min-width : 1024px){
                .phone, .tab{
                    display: none;
                }
            }

            /* Tablet */
            @media (min-width : 769px) and (max-width : 1023px){
                .laptop, .phone{display: none;}
            }

            /* Mobile Phone */
            @media(max-width : 768px){
                .tab, .laptop{
                    display: none;
                }
            }


         
        </style>
    </head>

    <body>
        <div class="laptop">
            <h1>Laptop</h1>
        </div>

        <div class="phone">
            <h1>Phone</h1>
        </div>

        <div class="tab">
            <h1>Tablet</h1>
        </div>
    </body>
</html>
