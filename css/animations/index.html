<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            height: 80vh;
            align-items: center;
            justify-content: center;

        }
        @keyframes abc{
            from {
                rotate: 0deg;
            }
            to{
                rotate: 360deg;
            }
        }
        .loader{
            height: 140px;
            width: 140px;
            border-radius : 50%;
            border : 10px solid gray;
            border-top : 10px solid rgb(54, 54, 255);
            animation-name: abc; 
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            animation-duration: 1s;
        }

        img{
            position: absolute;
            top: 15px;
            left: 15px;
            border-radius: 50%;
            height: 130px;
            width: 130px;
        }
    </style>
</head>
<body>
    <div style="position: relative;">
        <div class="loader"></div>  
        <img src="c.jpg" alt="">
    </div>  

</body>
</html>
