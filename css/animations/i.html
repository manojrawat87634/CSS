<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let num = parseInt(prompt())
        let i = 1; // Initlization
        while (i <= 10){ // Condtion
            document.write(num * i); // defination
            document.write("<br>"); // defination
            i++; // update
        }
    </script>
</body>
</html>
