<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>

        *{
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .container{
            padding: 20px;
            box-shadow: 0 0 10px black;
            display: flex;
            font-weight: 700;
            font-size: 17px;
            color: rgb(73, 73, 73);
            gap: 20px;
            align-items: center;
        }

        .container img{
            height: 30px;
            margin-right: auto;
        }

        .join-btn{
            border: 1px solid black;
            background-color: white;
            border-radius: 4px;
            font-weight: 700;
            font-size: 17px;
            padding: 10px 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1_umGFq06yTUm5tl7vVH7jwgvd3egZdoEwQ&s" alt="">
        <div>Fiverr Pro <i class="fa-solid fa-angle-down"></i></div>
        <div>Explore <i class="fa-solid fa-angle-down"></i></div>
        <div>EN <i class="fa-solid fa-globe"></i></div>
        <div>Become a Seller</div>
        <div>Sign In</div>
        <div><button class="join-btn">Join</button></div>
    </div>
</body>

</html>
