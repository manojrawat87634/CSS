<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .container {
            display: flex;
            justify-content: space-evenly;
            padding: 20px;
            align-items: center;
            box-shadow: 0 0 10px black;
        }
        
        .container input{
            width: 600px;
            height: 2.5rem;
            padding-left: 17px;
            font-size: 17px;
            outline: none;
            background-color: #f0f5ff;
            border: none;
        }

        .container button {
            border: none;
            background-color: white;
            display: flex;
            align-items: center;
            font-weight: 600;
            font-size: 17px;
            color: rgb(39, 39, 39);
        }
</style>
</head>

<body>
    <div class="container">
        <div>
            <img src="lg.svg"
                alt="">
        </div>

        <div>
            <input type="text" placeholder="Search for Products, Brands and More">
        </div>
        <div>
            <button>
                <img src="https://static-assets-web.flixcart.com/batman-returns/batman-returns/p/images/profile-6bae67.svg"
                    alt="">
                Login
            </button>
        </div>
        <div>
            <button>
                <img src="https://static-assets-web.flixcart.com/batman-returns/batman-returns/p/images/header_cart-43eb4e.svg"
                    alt="">
                Cart
            </button>
        </div>
        <div>
            <button>
                <img src="https://static-assets-web.flixcart.com/batman-returns/batman-returns/p/images/Store-134a49.svg"
                    alt="">
                Become a Seller
            </button>
        </div>
        <div>
            <button>
                <img src="https://static-assets-web.flixcart.com/batman-returns/batman-returns/p/images/header_3verticalDots-c2bef0.svg"
                    alt="">
            </button>
        </div>
    </div>
</body>

</html>
