<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns : repeat(7, 1fr);
            grid-template-rows: 23vh 23vh 23vh 23vh;
            gap: 10px;
            background-color: aqua;
        }

        .container div{
            background-color: gray;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="grid-column: 1 / 8;">Item One</div>
        <div style="grid-row: 2 / 4;">Item Two</div>
        <div style="grid-column: 2 / 8;">Item Three</div>
        <div style="grid-column: 2/ 5;">Item Three</div>
        <div style="grid-column: 5 / 8;">Item Three</div>
        <div style="grid-column: 1 / 8;">Item Three</div>
    </div>
</body>
</html>
