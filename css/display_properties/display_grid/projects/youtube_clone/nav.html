<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .yt-nav{
            display: flex;
            padding: 20px;
            gap: 20px;
            align-items: center;
            box-shadow: 0 0 10px black;
        }

        i{
            font-size: 20px;
        }

        .yt-nav img{
            height: 20px;
        }

        .yt-nav input{
            width: 500px;
            font-weight: 700;
            height: 2.4rem;
            border-radius: 20px 0 0 20px;
            border: 1px solid gray;
            padding-left: 14px;
        }
        .ml-a{
            margin-left: auto;
        }

        .inp-container{
            display: flex;
        }
        
        .search-btn{
            
            border-radius: 0px 20px 20px 0;
            padding: 6px 10px;
            border: 1px solid gray;
            border-left: none;

            background-color: white;
        }
    </style>
</head>
<body>
    <div class="yt-nav">
        <div><i class="fa-solid fa-bars"></i></div>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/YouTube_Logo_2017.svg/1280px-YouTube_Logo_2017.svg.png" alt="">
        <div class="inp-container ml-a">
            <input type="text" placeholder="Search"> 
            <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div ><button><i class="fa-solid fa-microphone"></i></button></div>
        <div class="ml-a"><i class="fa-solid fa-ellipsis-vertical"></i></div>
        <button><i class="fa-regular fa-circle-user"></i> Sign in</button>

    </div>
</body>
</html>
