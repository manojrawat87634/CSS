<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: 4rem 91vh;
            column-gap: 10px;
        }

        .container div{
            background-color: yellow;
        }

        .nav{
            grid-column: 1 / 8;
        }

        .content{
            grid-column: 2 / 8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">NavBar</div>
        <div class="sidebar">Sidbar</div>
        <div class="content">Content</div>
    </div>
</body>
</html>
